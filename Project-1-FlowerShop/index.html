<!DOCTYPE html>
<html lang="en">
    <head>
    <title>Flower Shop</title>
    <meta charset="UTF-8">
    <meta name="description" content="FlowerShop">
    <meta name="keywords" content="Aisha Kabir, AKabir, Kabir, Aisha, ITDEV160, Project 1">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" type="text/css" href="css/master.css">
    <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Open+Sans">
</head>
<body>
    <header>
        <h1>Aisha's Fabulous Flower Shop</h1>
        <p>The best flowers at the best prices</p>
    </header>
    <nav id="navbar" class="wrapper">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="roses.html">Shop Flowers</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">FAQ</a></li>
        </ul>
    </nav>
    <main>
        <h2 id="Title">Featured Products</h2>
        <h4 id="greeting"></h4>
        <div class="product-list">
            <div class="product">
                <img src="images/rosesimage.jpeg" alt="Roses">
                <h3>Roses</h3>
                <p>Price: $<span id="roses-price"></span></p>
            </div>
            <div class="product">
                <img src="images/tulips.jpeg" alt="Tulips">
                <h3>Tulips</h3>
                <p >Price: $<span id="tulip-price"></span></p>
            </div>
            <div class="product">
                <img src="images/sunflowers.jpeg" alt="Sunflowers">
                <h3>Sunflowers</h3>
                <p>Discount Price: $<span id="sunflower-price"></span> </p>
            </div>
        </div>
    </main>
    <footer>
        <p>Copyright 2021 Flower Shop</p>
    </footer>
    <script src="js/script.js"></script>
